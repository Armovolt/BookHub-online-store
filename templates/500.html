{% extends "base.html" %}

{% block title %}Помилка сервера - BookHub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 text-center">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <i class="fas fa-server text-6xl text-red-500 mb-6"></i>
        <h1 class="text-4xl font-bold text-red-800 mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-6">Внутрішня помилка сервера</h2>
        <p class="text-gray-600 mb-8">
            Вибачте, сталася технічна помилка. Наша команда вже працює над її вирішенням.
        </p>
        <div class="space-y-4">
            <a href="/" class="block bg-amber-600 text-white py-3 rounded-lg hover:bg-amber-700 transition">
                <i class="fas fa-home mr-2"></i>На головну
            </a>
            <button onclick="window.location.reload()" class="block border border-amber-600 text-amber-600 py-3 rounded-lg hover:bg-amber-50 transition w-full">
                <i class="fas fa-redo mr-2"></i>Спробувати ще раз
            </button>
        </div>
    </div>
</div>
{% endblock %}
