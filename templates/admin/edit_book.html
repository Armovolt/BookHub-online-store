{% extends "base.html" %}

{% block title %}Редагувати книгу - BookHub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold text-amber-800 mb-8">Редагувати книгу</h1>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2">Назва книги *</label>
                <input type="text" name="title" required 
                       value="{{ book.title }}"
                       class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-gray-700 mb-2">Автор *</label>
                <input type="text" name="author" required 
                       value="{{ book.author }}"
                       class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-gray-700 mb-2">Опис</label>
                <textarea name="description" rows="4"
                          class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">{{ book.description }}</textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2">Ціна *</label>
                    <input type="number" step="0.01" name="price" required 
                           value="{{ book.price }}"
                           class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Категорія</label>
                    <input type="text" name="category" 
                           value="{{ book.category if book.category else '' }}"
                           class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2">Кількість на складі *</label>
                    <input type="number" name="stock_quantity" required 
                           value="{{ book.stock_quantity }}"
                           class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" name="in_stock" id="in_stock" 
                           {% if book.in_stock %}checked{% endif %}
                           class="mr-2 h-5 w-5 text-amber-600">
                    <label for="in_stock" class="text-gray-700">В наявності</label>
                </div>
            </div>
            <div>
                <label class="block text-gray-700 mb-2">URL зображення</label>
                <input type="text" name="image_url" 
                       value="{{ book.image_url if book.image_url else '/static/images/default-book.jpg' }}"
                       class="w-full p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                <p class="text-sm text-gray-500 mt-1">Можна залишити пустим для зображення за замовчуванням</p>
            </div>
            <div class="flex space-x-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Зберегти зміни
                </button>
                <a href="{{ url_for('admin_books') }}" class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700">
                    Скасувати
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
