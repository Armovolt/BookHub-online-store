{% extends "base.html" %}

{% block title %}Сторінку не знайдено - BookHub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 text-center">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <i class="fas fa-exclamation-triangle text-6xl text-amber-500 mb-6"></i>
        <h1 class="text-4xl font-bold text-amber-800 mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-6">Сторінку не знайдено</h2>
        <p class="text-gray-600 mb-8">
            Вибачте, але сторінка, яку ви шукаєте, не існує або була переміщена.
        </p>
        <div class="space-y-4">
            <a href="/" class="block bg-amber-600 text-white py-3 rounded-lg hover:bg-amber-700 transition">
                <i class="fas fa-home mr-2"></i>На головну
            </a>
            <a href="/books" class="block border border-amber-600 text-amber-600 py-3 rounded-lg hover:bg-amber-50 transition">
                <i class="fas fa-book mr-2"></i>До каталогу книг
            </a>
        </div>
    </div>
</div>
{% endblock %}
